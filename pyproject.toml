[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-idea"
version = "1.0.0"
description = "LLM-IDEA: identifiability engine, Alien Universe testbed, scorers, and run records for the paper"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "Surya Shetty" }, { name = "Ulisses Braga-Neto" }]
# The identifiability engine itself needs only numpy, scipy, sympy (and mpmath, which
# sympy brings). pysindy is imported by the benchmarks package for its SINDy baseline.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "sympy>=1.13",
    "mpmath>=1.3",
    "pysindy>=2.1",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]
# Only the scripts that read a restored run database need these.
db = ["psycopg[binary,pool]>=3.2", "pgvector>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.7"]

[project.urls]
Repository = "https://github.com/Suraskey/llm-idea"

[tool.hatch.build.targets.wheel]
packages = ["src/ascension"]

[tool.hatch.build.targets.sdist]
include = ["src", "scripts", "tests", "prompts", "LICENSE", "README.md", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "smoke: tests that need real infrastructure; excluded by default",
    "slow: long-running tests; excluded by default",
    "live_llm: tests that call a model provider; excluded by default (none in this release)",
    "expensive: tests that cost money; excluded by default (none in this release)",
]
addopts = "-m 'not smoke and not slow and not live_llm and not expensive'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
